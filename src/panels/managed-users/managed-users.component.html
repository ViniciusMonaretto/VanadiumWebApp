<div class="group-div-display">
    <div class="page-header">
        <h1 class="page-title">Usuários gerenciados</h1>
        <p class="page-subtitle">{{ getManagedUsers().length }} usuário(s)</p>
    </div>
    <div class="main-screen-style">
        <list-of-users style="height: 100%;"
            [canEdit]="canEdit()"
            [users]="getManagedUsers()"
            (addUser)="onAddUser()"
            (removeUser)="onRemoveUser($event)"
            (userClick)="onUserClick($event)">
        </list-of-users>
    </div>
</div>

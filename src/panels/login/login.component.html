<div class="login-container">
    <div class="login-left">
      <img src="assets/images/banner.svg" alt="" />
    </div>

    <div class="login-right">
        <div class="login-page">
            <form class="login-card" (ngSubmit)="login()">
              <img src="assets/icon/icon.svg" alt="IoCloud" class="login-logo" />

              <h2 class="login-title">Olá, bem vindo(a)!</h2>
              <p class="login-subtitle">
                Faça o login para acessar a plataforma.
              </p>

              <div class="form-group">
                <label for="login-email">Usuário ou E-mail</label>
                <input
                  id="login-email"
                  name="email"
                  type="text"
                  autocomplete="username"
                  placeholder="Digite aqui"
                  [(ngModel)]="email"
                />
              </div>

              <div class="form-group">
                <label for="login-password">Senha</label>
                <div class="password-field">
                  <input
                    id="login-password"
                    name="password"
                    [type]="showPassword ? 'text' : 'password'"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    [(ngModel)]="password"
                  />
                  <button
                    type="button"
                    class="eye"
                    [class.eye--active]="showPassword"
                    (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
                    [title]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">👁</button>
                </div>
              </div>

              <button type="submit" class="login-button">
                Acessar
              </button>
            </form>
          </div>

    </div>
  </div>

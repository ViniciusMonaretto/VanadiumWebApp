<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="assets/icon/icon-white.svg" alt="IoCloud" />
  </div>

  <nav class="sidebar-nav">

    <!-- ROUTE ITEMS -->
    <ng-container *ngFor="let item of navItems">

      <!-- If it has a path → it's a route -->
      <a
        *ngIf="item.path"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="sidebar-item"
        [title]="item.name"
        [attr.aria-label]="item.name"
      >
        <lucide-icon [img]="item.icon" size="22"></lucide-icon>
      </a>

      <!-- If it has an action → it's a button -->
      <button
        *ngIf="item.action"
        type="button"
        class="sidebar-item"
        [class.active]="item.isActive?.()"
        [attr.aria-current]="item.isActive?.() ? 'page' : null"
        [title]="item.name"
        [attr.aria-label]="item.name"
        (click)="handleAction(item)"
      >
        <lucide-icon [img]="item.icon" size="22"></lucide-icon>
      </button>

    </ng-container>

  </nav>
</aside>

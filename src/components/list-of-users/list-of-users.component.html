<div style="height: 100%;">
  <div style="height: 100%; overflow-y: auto;">
    <div class="main-group-div" [ngStyle]="getGridStyle()">
      <div class="user-card flex-item"
           *ngFor="let user of users"
           [class.user-card--editable]="canEdit"
           [class.user-card--clickable]="canEdit"
           (click)="canEdit && onUserCardClick(user)">
        <div class="user-card-header">
          <span class="user-card-name">{{ user.name }}</span>
          <button *ngIf="canEdit" type="button" class="delete-btn" (click)="removeUserClick($event, user)" mat-icon-button aria-label="Remover">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <div class="user-card-email">{{ user.email }}</div>
        <div class="user-card-type">{{ getUserTypeLabel(user.userType) }}</div>
      </div>
      <div *ngIf="canEdit" class="add-wrapper">
        <io-button variant="primary" ariaLabel="Adicionar usuário" title="Adicionar usuário" (clicked)="addUser.emit()">
          <mat-icon style="font-size: 36px; height: 36px; width: 36px;">add</mat-icon>
        </io-button>
      </div>
    </div>
  </div>
</div>
